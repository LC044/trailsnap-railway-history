name: Collect railway history
on:
  workflow_dispatch:
    inputs:
      publish_existing:
        description: Publish retained history without repeating collection
        type: boolean
        default: false
      query_date_offset:
        description: Query date offset in days
        default: '0'
      test_prefix:
        description: Test prefix (empty for production)
        default: ''
      test_limit:
        description: Detail limit (0 for production)
        default: '0'
  schedule:
    - cron: '0 19 * * *'
permissions:
  contents: write
concurrency:
  group: railway-history-publisher
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm test
      - name: Collect with checkpointing
        if: ${{ !inputs.publish_existing }}
        env:
          QUERY_DATE_OFFSET: ${{ inputs.query_date_offset || '0' }}
          TEST_PREFIX: ${{ inputs.test_prefix || '' }}
          TEST_LIMIT: ${{ inputs.test_limit || '0' }}
          DATA_DIR: ${{ (inputs.test_prefix != '' || (inputs.test_limit != '' && inputs.test_limit != '0')) && 'snapshot/test-data' || 'data' }}
        run: npm run dev
      - name: Publish retained history as a feed
        if: ${{ inputs.publish_existing }}
        run: npx tsx src/publish-existing.ts
      - name: Commit immutable packs and manifest together
        if: success() && inputs.test_prefix == '' && (inputs.test_limit == '' || inputs.test_limit == '0')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ assets/station_gps.json
          if ! git diff --cached --quiet; then
            git commit -m "data: railway observation $(date -u +%FT%TZ)"
            git push
          fi
          echo "FEED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Create downloadable historical snapshot
        if: success() && inputs.test_prefix == '' && (inputs.test_limit == '' || inputs.test_limit == '0')
        run: |
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("data/feed/manifest.json")); fs.copyFileSync("data/feed/"+m.snapshot.file,"snapshot/railway-history.json.gz"); fs.copyFileSync("data/feed/manifest.json","snapshot/manifest.json")'
          gh release create "data-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" snapshot/railway-history.json.gz snapshot/manifest.json --target "$FEED_COMMIT" --title "Railway history ${GITHUB_RUN_ID}" --notes 'Complete retained history. Collection coverage is reported in manifest.metadata; partial observations never imply cancellation.'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: railway-snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: snapshot/
          retention-days: 30
